name: Bug report
description: Something is broken or does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here. Follow the security policy (SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, or server details if they matter.
